<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 설치 마법사</title>
<style>
  :root {
    --bg:#f6f5f1; --card:#ffffff; --border:#e2dfd6; --ink:#1d1b17; --muted:#5f5b52;
    --accent:#b9532f; --accent-ink:#ffffff; --accent-soft:#f7e6dd;
    --ok:#22703f; --ok-soft:#e3f2e8; --warn:#8a5a00; --warn-soft:#fbf0d6;
    --err:#b42318; --err-soft:#fdebe9; --info:#1f5d99; --info-soft:#e7f0fa;
    --code-bg:#1f1f1f; --code-ink:#f1f1f1;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Malgun Gothic','Apple SD Gothic Neo','Segoe UI','Noto Sans KR',sans-serif; font-size:17px; line-height:1.65; }
  a { color:var(--info); }
  button { font-family:inherit; }
  .wrap { max-width:880px; margin:0 auto; padding:0 16px; }

  /* 머리글 + 진행 막대 */
  .top { position:sticky; top:0; z-index:10; background:rgba(246,245,241,.96); border-bottom:1px solid var(--border); backdrop-filter:blur(4px); }
  .top .wrap { padding-top:12px; padding-bottom:10px; }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand h1 { font-size:20px; margin:0; }
  .live { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .live .pulse { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(34,112,63,.5); animation:pulse 2s infinite; }
  .live.down .pulse { background:var(--err); animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,112,63,.5)} 70%{box-shadow:0 0 0 8px rgba(34,112,63,0)} 100%{box-shadow:0 0 0 0 rgba(34,112,63,0)} }
  .progress { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:10px; }
  .seg { border:0; background:transparent; padding:0; cursor:pointer; text-align:left; color:var(--muted); }
  .seg:disabled { cursor:default; }
  .seg .bar { height:8px; border-radius:4px; background:#dcd8cd; }
  .seg .lbl { display:flex; gap:5px; align-items:center; font-size:14px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg .n { display:inline-flex; width:22px; height:22px; border-radius:50%; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; background:#dcd8cd; color:#4a463e; flex:none; }
  .seg.done .bar, .seg.done .n { background:var(--ok); color:#fff; }
  .seg.done .lbl { color:var(--ok); }
  .seg.error .bar, .seg.error .n { background:var(--err); color:#fff; }
  .seg.doing .bar { background:repeating-linear-gradient(45deg,var(--accent) 0 8px,#d9805f 8px 16px); }
  .seg.current .lbl { color:var(--ink); font-weight:700; }
  .seg.current .bar { outline:2px solid var(--ink); outline-offset:2px; }
  .seg.current .n { background:var(--ink); color:#fff; }
  .seg.current.done .n { background:var(--ok); }
  .where { font-size:14.5px; color:var(--muted); margin-top:6px; }
  .where b { color:var(--ink); }

  main { padding:20px 0 120px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
  .kicker { font-size:14px; color:var(--accent); font-weight:700; letter-spacing:.02em; }
  .card h2 { font-size:25px; margin:2px 0 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { font-size:14px; padding:3px 11px; border-radius:20px; font-weight:700; white-space:nowrap; }
  .pill.todo { background:#ecebe6; color:#4a463e; }
  .pill.doing { background:var(--accent-soft); color:var(--accent); }
  .pill.done { background:var(--ok-soft); color:var(--ok); }
  .pill.error { background:var(--err-soft); color:var(--err); }
  .purpose { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .purpose > div { background:#faf9f6; border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:16px; }
  .purpose b { display:block; font-size:14px; color:var(--muted); margin-bottom:2px; }
  h3 { font-size:19px; margin:22px 0 8px; }
  p { margin:8px 0; }
  .muted { color:var(--muted); }
  .small { font-size:14.5px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; background:var(--accent); color:var(--accent-ink); border:2px solid var(--accent); padding:10px 22px; border-radius:10px; font-size:17.5px; cursor:pointer; font-weight:700; text-decoration:none; }
  .btn:hover { filter:brightness(1.06); }
  .btn:focus-visible, .seg:focus-visible, .chk input:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid #2b6cb0; outline-offset:2px; }
  .btn.secondary { background:#fff; color:var(--accent); }
  .btn.plain { background:#fff; color:var(--ink); border-color:var(--border); }
  .btn.small { min-height:40px; font-size:15.5px; padding:6px 14px; }
  .btn.ok { background:var(--ok); border-color:var(--ok); }
  .btn:disabled { background:#d6d3cb; border-color:#d6d3cb; color:#6d695f; cursor:not-allowed; filter:none; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .nav { display:flex; justify-content:space-between; gap:10px; margin-top:26px; padding-top:18px; border-top:1px solid var(--border); flex-wrap:wrap; }

  .state { display:flex; align-items:flex-start; gap:12px; border-radius:10px; padding:14px 16px; margin:14px 0; font-size:16.5px; }
  .state .ico { font-size:22px; line-height:1.2; flex:none; }
  .state.done { background:var(--ok-soft); color:#174d2c; }
  .state.todo { background:#f1f0eb; }
  .state.doing { background:var(--accent-soft); }
  .state.warn { background:var(--warn-soft); color:#5c3d00; }
  .state.info { background:var(--info-soft); color:#173f66; }
  .spinner { width:20px; height:20px; border:3px solid rgba(185,83,47,.25); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; flex:none; margin-top:3px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .errbox { border:2px solid var(--err); background:var(--err-soft); border-radius:12px; padding:16px 18px; margin:14px 0; }
  .errbox .t { font-weight:800; color:var(--err); font-size:18px; }
  .errbox .lab { font-weight:700; margin-top:8px; }
  .errbox ol { margin:4px 0 4px; padding-left:22px; }
  pre.raw { background:var(--code-bg); color:var(--code-ink); padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; font-size:13.5px; max-height:260px; overflow:auto; margin:8px 0; }

  details { margin:10px 0; }
  summary { cursor:pointer; font-weight:700; color:var(--accent); padding:4px 0; }
  .stuck { margin-top:18px; }
  .stuck-panel { border:1px solid var(--border); border-radius:12px; background:#fffdf8; padding:6px 16px; margin-top:10px; }
  .stuck-panel details { border-bottom:1px solid var(--border); margin:0; padding:8px 0; }
  .stuck-panel details:last-child { border-bottom:0; }
  .stuck-panel summary { color:var(--ink); }
  .stuck-panel .ans { padding:6px 0 4px 4px; font-size:16px; }
  .stuck-panel .ans ol, .stuck-panel .ans ul { margin:4px 0; padding-left:22px; }

  .steps-ol { counter-reset:s; list-style:none; padding:0; margin:10px 0; }
  .steps-ol > li { counter-increment:s; position:relative; padding:4px 0 10px 44px; }
  .steps-ol > li::before { content:counter(s); position:absolute; left:0; top:2px; width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:16px; }

  .prompt { background:var(--code-bg); color:var(--code-ink); border-radius:10px; padding:14px 16px; font-size:15px; white-space:pre-wrap; line-height:1.6; margin:8px 0; max-height:320px; overflow:auto; }
  .kbd { display:inline-block; border:1px solid #b9b5aa; border-bottom-width:3px; border-radius:6px; padding:0 7px; font-size:14.5px; background:#fff; font-family:Consolas,monospace; color:var(--ink); }
  code { background:#ecebe6; padding:1px 6px; border-radius:5px; font-size:.92em; }

  label.field { display:block; font-weight:700; margin-top:16px; }
  .field-hint { font-size:14.5px; color:var(--muted); margin-top:3px; }
  input[type=text], input[type=email], input[type=password], select { width:100%; max-width:480px; padding:12px 12px; border:2px solid #cfcbc0; border-radius:9px; font-size:17px; margin-top:6px; background:#fff; color:var(--ink); }
  select { width:auto; }
  .saved-tag { display:inline-block; font-size:14px; color:var(--ok); background:var(--ok-soft); padding:1px 9px; border-radius:12px; margin-left:6px; font-weight:700; }
  .counter { font-size:14.5px; margin-top:4px; }
  .counter.good { color:var(--ok); font-weight:700; }
  .counter.bad { color:var(--err); }

  .checklist { list-style:none; padding:0; margin:12px 0; }
  .chk { display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:2px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .chk.on { border-color:var(--ok); background:#f5fbf7; }
  .chk input { width:26px; height:26px; margin:1px 0 0; accent-color:var(--ok); flex:none; }
  .chk .sub { font-size:14.5px; color:var(--muted); }
  .can-do { margin:8px 0 4px; padding-left:0; list-style:none; }
  .can-do li { padding:6px 0 6px 38px; position:relative; }
  .can-do li span.b { position:absolute; left:0; top:6px; width:28px; height:28px; border-radius:8px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
  .facts { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
  .fact { background:#faf9f6; border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:15.5px; }

  /* 화면 모형(그림 안내) */
  .mock-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0; }
  .mock-step { border:1px solid var(--border); border-radius:12px; padding:12px; background:#fff; }
  .mock-step .cap { font-weight:700; margin-bottom:8px; display:flex; gap:8px; align-items:flex-start; }
  .mock-step .cap .num { flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .mock { border:1px solid #c9c5ba; border-radius:8px; overflow:hidden; background:#fff; font-size:13.5px; font-family:Arial,'Malgun Gothic',sans-serif; }
  .mock-bar { background:#ebe9e3; padding:6px 8px; display:flex; align-items:center; gap:6px; }
  .mock-bar i { width:9px; height:9px; border-radius:50%; background:#c9c5ba; display:inline-block; }
  .mock-url { flex:1; background:#fff; border-radius:12px; padding:2px 10px; color:#444; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mock-body { padding:12px; position:relative; min-height:118px; }
  .mock-h { font-size:15px; font-weight:700; margin-bottom:8px; color:#202124; }
  .mock-row { display:flex; justify-content:space-between; align-items:center; border:1px solid #e3e3e3; border-radius:6px; padding:7px 10px; margin-bottom:6px; color:#3c4043; }
  .mock-toggle { width:34px; height:18px; border-radius:9px; background:#1a73e8; position:relative; }
  .mock-toggle::after { content:''; position:absolute; right:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; }
  .mock-input { border:1px solid #9aa0a6; border-radius:4px; padding:6px 8px; color:#202124; margin:4px 0 8px; }
  .mock-btn { display:inline-block; background:#1a73e8; color:#fff; border-radius:16px; padding:4px 14px; font-weight:700; }
  .mock-yellow { background:#fdf3c4; border-radius:6px; padding:10px; text-align:center; font-family:Consolas,monospace; font-size:17px; letter-spacing:1px; color:#202124; }
  .mock-term { background:#111; color:#e6e6e6; font-family:Consolas,monospace; font-size:12.5px; padding:10px; min-height:118px; white-space:pre-wrap; line-height:1.5; }
  .mock-term .hl { background:#3a3a3a; color:#fff; }
  .mark { outline:3px solid #e8590c; outline-offset:2px; border-radius:6px; position:relative; }
  .pin { position:absolute; width:24px; height:24px; border-radius:50%; background:#e8590c; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.3); }

  .banner { border-radius:12px; padding:14px 18px; margin-bottom:14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .banner.err { background:var(--err-soft); border:2px solid var(--err); }
  .banner.ok { background:var(--ok-soft); border:2px solid var(--ok); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1d1b17; color:#fff; padding:12px 20px; border-radius:10px; font-size:16px; z-index:50; max-width:calc(100% - 32px); box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .twocol { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .box { border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:#fff; }
  .tag { display:inline-block; font-size:13px; font-weight:700; padding:1px 8px; border-radius:6px; background:#ecebe6; color:#4a463e; }

  /* 데모 모드 조작판 */
  .demo { position:fixed; right:12px; bottom:12px; z-index:40; background:#1d1b17; color:#fff; border-radius:12px; padding:10px 12px; font-size:13.5px; width:300px; box-shadow:0 6px 24px rgba(0,0,0,.3); }
  .demo b { color:#ffd8a8; }
  .demo .r { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .demo button { background:#3a3833; color:#fff; border:1px solid #57544c; border-radius:6px; padding:4px 7px; cursor:pointer; font-size:13px; }
  .demo button.on { background:#ffd8a8; color:#1d1b17; border-color:#ffd8a8; font-weight:700; }
  .demo .x { float:right; background:none; border:0; color:#aaa; font-size:16px; padding:0 4px; }

  @media (max-width: 820px) {
    body { font-size:16.5px; }
    .purpose, .mock-grid, .twocol { grid-template-columns:1fr; }
    .card { padding:18px 16px; }
    .card h2 { font-size:22px; }
    .seg .lbl .t { display:none; }
    .seg.current .lbl .t { display:inline; }
    .demo { width:auto; left:12px; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Claude Code 설치 마법사</h1>
      <div class="live" id="live"><span class="pulse"></span><span id="live-text">연결 중…</span></div>
    </div>
    <nav class="progress" id="progress" aria-label="진행 단계"></nav>
    <div class="where" id="where"></div>
  </div>
</div>
<main class="wrap">
  <div id="banners"></div>
  <div id="view"></div>
</main>
<div id="demo"></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
// ===========================================================================
// 기본 설정
// ===========================================================================
const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.get('demo') === '1';
const POLL_MS = 5000;

const STEPS = [
  { id: 'start', short: '시작', title: '시작하기' },
  { id: 'install', n: 1, short: '설치', title: 'Claude Code 설치' },
  { id: 'login', n: 2, short: '로그인', title: 'Claude Code 로그인' },
  { id: 'gmail', n: 3, short: 'Gmail', title: 'Gmail 앱 비밀번호' },
  { id: 'agent', n: 4, short: '자동화 만들기', title: '첫 자동화 만들기' },
  { id: 'schedule', n: 5, short: '매일 예약', title: '매일 자동 실행 예약' },
  { id: 'finish', short: '완료', title: '완료' },
];
const WORK = ['install', 'login', 'gmail', 'agent', 'schedule'];
const STATE_LABEL = { todo: '아직 안 함', doing: '진행 중', done: '완료', error: '문제 있음' };

const S = {
  view: 'start',
  status: null,
  serverDown: false,
  lastCheck: 0,
  prev: null,
  autoTimer: null,
  autoNext: null,
  ui: { opened: {}, pending: {}, results: {}, stuck: {}, open: {} },
  form: { gmail_sender: '', gmail_app_password: '', recipient: '', krx_key: '', hour: 7, minute: 0 },
  formLoaded: false,
  checklist: loadLocal('checklist', { win: false, net: false, sub: false, gmail: false }),
  demo: { states: { install: 'todo', login: 'todo', gmail: 'todo', agent: 'todo', schedule: 'todo' }, hidden: false },
};

function loadLocal(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem('wizard.' + key)); return v && typeof v === 'object' ? Object.assign({}, fallback, v) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, value) { try { localStorage.setItem('wizard.' + key, JSON.stringify(value)); } catch (e) { /* 저장 불가해도 동작에는 지장 없음 */ } }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ===========================================================================
// Claude Code에게 붙여넣을 요청 문장 (파일 이름은 server.js의 AGENTS와 같아야 함)
// ===========================================================================
const PROMPT_BASIC = `매일 아침 원/달러 환율과 코스피 지수를 요약해서 나에게 이메일로 보내주는 프로그램을 만들어줘.

꼭 지켜줘:
1. 파일은 agent 폴더 안에 만들고, 실행 파일 이름은 agent/daily_market_agent.js 로 해줘. (Node.js 사용)
2. 인증키(API 키)가 필요 없는 공개 데이터만 써줘. 원/달러 환율, 코스피 지수와 전날 대비 등락률을 넣어줘.
3. 메일 정보는 agent/.env 에서 읽어줘. 변수 이름은 GMAIL_SENDER, GMAIL_APP_PASSWORD, REPORT_RECIPIENT 야.
   .env 는 이미 만들어져 있으니 그 파일을 열어보거나 내용을 화면에 출력하지 마. 파일 위치는 스크립트 파일 위치(__dirname) 기준으로 찾아줘.
4. 메일은 Gmail(smtp.gmail.com, 465번 포트)로 보내줘. 필요한 패키지는 agent 폴더 안에만 설치해줘(nodemailer 정도만).
5. 실행할 때마다 결과(시각, 성공/실패)를 agent/last_run.log 에 한 줄씩 남겨줘. 비밀번호는 어디에도 출력하거나 기록하지 마.
6. 다 만들면 한 번 실행해서 나에게 테스트 메일 1통을 보내줘. 오류가 나면 스스로 고쳐서 다시 시도해줘.
7. 나는 프로그래밍을 몰라. 진행 상황은 쉬운 한국어로 짧게 알려줘.`;

const PROMPT_ADVANCED = `한국거래소(KRX) 데이터로 업종(섹터)별 등락률을 정리해서 매일 이메일로 보내주는 프로그램을 만들어줘.

꼭 지켜줘:
1. 실행 파일 이름은 agent/sector_report_agent.js 로 해줘. (Node.js 사용, agent 폴더 안에만 만들기)
2. KRX API 키는 agent/.env 의 KRX_AUTH_KEY 에서 읽어줘. 메일 정보는 GMAIL_SENDER, GMAIL_APP_PASSWORD, REPORT_RECIPIENT 야.
   .env 파일을 열어보거나 내용을 출력하지 말고, 위치는 스크립트 파일 위치(__dirname) 기준으로 찾아줘.
3. 오른 업종은 빨간색, 내린 업종은 파란색인 보기 좋은 표로 만들어줘.
4. 실행할 때마다 결과를 agent/last_run.log 에 한 줄씩 남기고, 비밀번호와 키는 어디에도 출력하지 마.
5. 다 만들면 한 번 실행해서 나에게 테스트 메일 1통을 보내줘. 진행 상황은 쉬운 한국어로 짧게 알려줘.`;

const PROMPT_RENAME = `방금 만든 프로그램의 실행 파일 이름을 agent/daily_market_agent.js 로 바꿔줘. 다른 내용은 그대로 두고, 바꾼 다음 한 번 실행해서 테스트 메일 1통을 보내줘.`;

function fixPrompt(raw, file) {
  return `${file || 'agent/daily_market_agent.js'} 를 실행했더니 아래 오류가 났어. 무엇이 문제였는지 쉬운 한국어로 짧게 설명하고, 고친 다음 다시 실행해서 테스트 메일 1통을 보내줘. agent/.env 파일은 열어보지 마.

[오류 내용]
${raw || '(내용 없음)'}`;
}

// ===========================================================================
// 서버와 통신
// ===========================================================================
async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Wizard': '1' }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  return res.json();
}

let polling = null;
async function refresh() {
  if (DEMO) { S.status = demoStatus(); S.lastCheck = Date.now(); afterStatus(); return; }
  try {
    S.status = await api('/api/status');
    S.serverDown = false;
  } catch (e) {
    S.serverDown = true;
  }
  S.lastCheck = Date.now();
  afterStatus();
}

function schedulePoll() {
  clearTimeout(polling);
  const running = S.status && Object.values(S.status.jobs || {}).some((j) => j.state === 'running');
  const anyPending = Object.values(S.ui.pending).some(Boolean);
  polling = setTimeout(async () => { await refresh(); schedulePoll(); }, (running || anyPending) ? 1500 : POLL_MS);
}

// ===========================================================================
// 단계 상태 계산: todo(아직) / doing(진행 중) / done(완료) / error(문제)
// ===========================================================================
function job(name) { return (S.status && S.status.jobs && S.status.jobs[name]) || null; }

function computeStates() {
  const st = S.status;
  const out = { install: 'todo', login: 'todo', gmail: 'todo', agent: 'todo', schedule: 'todo' };
  if (!st) return out;
  const j = (n) => job(n) || {};
  // 1 설치
  if (j('install').state === 'running') out.install = 'doing';
  else if (st.claude.installed) out.install = 'done';
  else if (j('install').state === 'error') out.install = 'error';
  // 2 로그인
  if (st.login.logged_in) out.login = 'done';
  else if (j('login-verify').state === 'running') out.login = 'doing';
  else if (j('login-verify').state === 'error') out.login = 'error';
  else if (S.ui.opened.login) out.login = 'doing';
  // 3 Gmail
  const saved = st.config.has_gmail_password && !!st.config.gmail_sender;
  if (j('smtp-check').state === 'running' || S.ui.pending.save) out.gmail = 'doing';
  else if (j('smtp-check').state === 'error' || (S.ui.results.save && !S.ui.results.save.ok)) out.gmail = 'error';
  else if (saved) out.gmail = 'done';
  // 4 자동화
  const exists = st.agents.basic.exists;
  if (j('run-basic').state === 'running') out.agent = 'doing';
  else if (exists && j('run-basic').state === 'error') out.agent = 'error';
  else if (exists) out.agent = 'done';
  else if (S.ui.opened.agent) out.agent = 'doing';
  // 5 예약
  const sr = S.ui.results.schedule;
  if (S.ui.pending.schedule) out.schedule = 'doing';
  else if (sr && !sr.ok) out.schedule = 'error';
  else if (st.schedule.basic.registered) out.schedule = 'done';
  return out;
}

function unlocked(viewId, states) {
  if (viewId === 'start') return true;
  if (DEMO) return true;
  if (viewId === 'finish') return WORK.every((w) => states[w] === 'done');
  const idx = WORK.indexOf(viewId);
  return WORK.slice(0, idx).every((w) => states[w] === 'done' || (w === 'gmail' && states[w] === 'error' && S.status && S.status.config.has_gmail_password));
}

function firstOpenStep(states) {
  return WORK.find((w) => states[w] !== 'done') || 'finish';
}

function afterStatus() {
  const states = computeStates();
  // 지금 보고 있는 단계가 방금 완료되면 → 초록 체크 + 잠시 뒤 다음 단계로 자동 이동
  if (S.prev && !DEMO && WORK.includes(S.view) && S.prev[S.view] !== 'done' && states[S.view] === 'done') {
    const idx = STEPS.findIndex((s) => s.id === S.view);
    const next = STEPS[idx + 1].id;
    S.autoNext = { from: S.view, to: next, at: Date.now() + 3500 };
    clearTimeout(S.autoTimer);
    S.autoTimer = setTimeout(() => { if (S.autoNext && S.view === S.autoNext.from) go(S.autoNext.to); S.autoNext = null; render(); }, 3500);
  }
  S.prev = states;
  if (S.status && !S.formLoaded) {
    S.form.gmail_sender = S.status.config.gmail_sender;
    S.form.recipient = S.status.config.recipient === S.status.config.gmail_sender ? '' : S.status.config.recipient;
    if (S.status.schedule.basic.registered && S.status.schedule.basic.hour !== undefined) {
      S.form.hour = S.status.schedule.basic.hour; S.form.minute = S.status.schedule.basic.minute;
    }
    S.formLoaded = true;
  }
  render();
}

// ===========================================================================
// 화면 그리기
// ===========================================================================
let lastHtml = '';
function render() {
  const states = computeStates();
  renderTop(states);
  renderBanners();
  const html = renderView(S.view, states);
  if (html !== lastHtml) {
    const focus = captureFocus();
    document.getElementById('view').innerHTML = html;
    lastHtml = html;
    restoreFocus(focus);
  }
  renderDemo();
}

function renderTop(states) {
  const items = STEPS.slice(1).map((s) => {
    const stt = s.id === 'finish' ? (WORK.every((w) => states[w] === 'done') ? 'done' : 'todo') : states[s.id];
    const can = unlocked(s.id, states);
    const cur = S.view === s.id;
    const num = stt === 'done' ? '✓' : stt === 'error' ? '!' : (s.n || '★');
    return `<button class="seg ${stt} ${cur ? 'current' : ''}" data-action="go" data-view="${s.id}" ${can ? '' : 'disabled'} aria-current="${cur ? 'step' : 'false'}" title="${esc(s.title)} · ${STATE_LABEL[stt]}">
      <div class="bar"></div><div class="lbl"><span class="n">${num}</span><span class="t">${esc(s.short)}</span></div></button>`;
  }).join('');
  const prog = document.getElementById('progress');
  if (prog.innerHTML !== items) prog.innerHTML = items;
  const step = STEPS.find((s) => s.id === S.view);
  const doneCount = WORK.filter((w) => states[w] === 'done').length;
  let where;
  if (S.view === 'start') where = `시작 화면 · 준비물을 확인해주세요 <span class="muted">(완료 ${doneCount}/5)</span>`;
  else if (S.view === 'finish') where = `<b>모든 단계 완료</b> · 수고하셨어요!`;
  else where = `지금 <b>${step.n}단계 / 전체 5단계</b> · ${esc(step.title)} <span class="muted">(완료 ${doneCount}/5)</span>`;
  document.getElementById('where').innerHTML = where;
  const live = document.getElementById('live');
  live.classList.toggle('down', S.serverDown);
  document.getElementById('live-text').textContent = DEMO ? '데모 모드 (서버 없이 화면만 보기)'
    : S.serverDown ? '마법사 서버와 연결이 끊김'
    : S.lastCheck ? `5초마다 자동 확인 중 · ${new Date(S.lastCheck).toLocaleTimeString('ko-KR')}` : '연결 중…';
}

function renderBanners() {
  let html = '';
  if (S.serverDown) {
    html += `<div class="banner err"><div><b>마법사의 검은 창이 닫힌 것 같아요.</b><br>
      <span class="small">start.bat을 다시 더블클릭하면 이어서 진행할 수 있어요. 지금까지 한 작업은 그대로 남아 있어요.</span></div>
      <button class="btn small plain" data-action="refresh">다시 연결</button></div>`;
  }
  if (S.status && !S.status.node.ok) {
    html += `<div class="banner err"><div><b>Node.js 버전이 너무 낮아요 (${esc(S.status.node.version)}).</b><br>
      <span class="small">Claude Code는 Node.js ${S.status.node.min} 이상이 필요해요. <a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a>에서 LTS 버전을 설치한 뒤 start.bat을 다시 실행해주세요.</span></div></div>`;
  }
  const el = document.getElementById('banners');
  if (el.innerHTML !== html) el.innerHTML = html;
}

function pill(state) { return `<span class="pill ${state}">${state === 'done' ? '✓ ' : ''}${STATE_LABEL[state]}</span>`; }

function head(id, state, what, why) {
  const s = STEPS.find((x) => x.id === id);
  return `<div class="kicker">${s.n}단계 / 5</div>
    <h2>${esc(s.title)} ${pill(state)}</h2>
    <div class="purpose"><div><b>이 단계에서 하는 일</b>${what}</div><div><b>왜 필요한가요?</b>${why}</div></div>`;
}

function stateBox(kind, icon, html) {
  const ico = kind === 'doing' ? '<span class="spinner" aria-hidden="true"></span>' : `<span class="ico" aria-hidden="true">${icon}</span>`;
  return `<div class="state ${kind}" role="status">${ico}<div>${html}</div></div>`;
}

function elapsed(started) {
  if (!started) return '';
  const sec = Math.max(0, Math.round((Date.now() - started) / 1000));
  return `<span class="muted small" data-elapsed="${started}">(${Math.floor(sec / 60)}분 ${sec % 60}초 지남)</span>`;
}

function errorBox(err, raw, opts = {}) {
  if (!err) return '';
  const fix = opts.fix ? `<button class="btn small" data-action="copy" data-copy="${esc(opts.fix)}" data-msg="복사됐어요! Claude Code 창을 한 번 클릭하고 Ctrl+V → Enter를 누르세요.">📋 고쳐달라고 요청 복사</button>` : '';
  const retry = opts.retry ? `<button class="btn small secondary" data-action="${opts.retry}">↻ 다시 시도</button>` : '';
  return `<div class="errbox" role="alert">
    <div class="t">⚠️ ${esc(err.title)}</div>
    <div class="lab">무슨 일인가요?</div><div>${esc(err.what)}</div>
    <div class="lab">지금 할 일</div><ol>${(err.todo || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ol>
    ${fix || retry ? `<div class="row">${fix}${retry}</div>` : ''}
    ${raw ? `<details data-key="raw-${esc(opts.key || '')}"${S.ui.open['raw-' + (opts.key || '')] ? ' open' : ''}><summary>자세히 보기 (컴퓨터가 보낸 원래 메시지)</summary><pre class="raw">${esc(raw)}</pre>
      <button class="btn small plain" data-action="copy" data-copy="${esc(raw)}">원문 복사</button></details>` : ''}
  </div>`;
}

function jobError(name, opts) {
  const j = job(name);
  if (!j || j.state !== 'error') return '';
  return errorBox(j.error, j.raw, Object.assign({ key: name }, opts || {}));
}

function stuck(id, items) {
  const open = !!S.ui.stuck[id];
  return `<div class="stuck">
    <button class="btn plain" data-action="stuck" data-step="${id}" aria-expanded="${open}">🙋 막혔어요${open ? ' (닫기)' : ''}</button>
    ${open ? `<div class="stuck-panel"><p class="small muted">이 단계에서 자주 생기는 문제예요. 해당하는 것을 눌러보세요.</p>
      ${items.map((it, i) => `<details data-key="stuck-${id}-${i}"${S.ui.open[`stuck-${id}-${i}`] ? ' open' : ''}><summary>${esc(it.q)}</summary><div class="ans">${it.a}</div></details>`).join('')}
    </div>` : ''}
  </div>`;
}

function nav(id, states) {
  const idx = STEPS.findIndex((s) => s.id === id);
  const prev = STEPS[idx - 1];
  const next = STEPS[idx + 1];
  const canNext = next && unlocked(next.id, states);
  let auto = '';
  if (S.autoNext && S.autoNext.from === id) auto = `<span class="small" style="color:var(--ok);font-weight:700">✓ 완료! 잠시 뒤 다음 단계로 넘어가요</span>`;
  return `<div class="nav">
    ${prev ? `<button class="btn plain" data-action="go" data-view="${prev.id}">← 이전</button>` : '<span></span>'}
    ${auto}
    ${next ? `<button class="btn ${canNext ? 'ok' : ''}" data-action="go" data-view="${next.id}" ${canNext ? '' : 'disabled'}>${next.id === 'finish' ? '완료 화면으로' : '다음 단계'} →</button>` : ''}
  </div>
  ${next && !canNext ? `<p class="small muted" style="text-align:right">이 단계가 완료되면 [다음 단계] 버튼이 열려요. 화면이 5초마다 자동으로 확인해요.</p>` : ''}`;
}

function copyBlock(text, label, msg) {
  return `<div class="prompt" tabindex="0">${esc(text)}</div>
    <div class="row"><button class="btn" data-action="copy" data-copy="${esc(text)}" data-msg="${esc(msg || '복사됐어요! 붙여넣을 곳을 클릭하고 Ctrl+V를 누르세요.')}">📋 ${esc(label || '복사')}</button>
    <span class="small muted">붙여넣기는 <span class="kbd">Ctrl</span> + <span class="kbd">V</span></span></div>`;
}

function renderView(id, states) {
  switch (id) {
    case 'start': return viewStart(states);
    case 'install': return viewInstall(states);
    case 'login': return viewLogin(states);
    case 'gmail': return viewGmail(states);
    case 'agent': return viewAgent(states);
    case 'schedule': return viewSchedule(states);
    case 'finish': return viewFinish(states);
  }
  return '';
}

function viewInstall(states) {

    ${st ? stateBox(st.node.ok ? 'done' : 'warn', st.node.ok ? '✅' : '⚠️', `Node.js ${esc(st.node.version)} ${st.node.ok ? '준비됨 (Claude Code를 돌리는 바탕 프로그램)' : `— ${st.node.min} 이상이 필요해요`}`) : ''}

function viewLogin(states) {
  const st = S.status;
  const s = states.login;
  const verifying = job('login-verify') && job('login-verify').state === 'running';
  let box;
  if (s === 'done') box = stateBox('done', '✅', `<b>로그인되어 있어요.</b> <span class="small">Claude Code를 쓸 준비가 끝났어요.</span>`);
  else if (verifying) box = stateBox('doing', '', `<b>Claude에게 실제로 말을 걸어 확인하는 중…</b> ${elapsed(job('login-verify').started)} <span class="small">(최대 1~2분)</span>`);

<span class="hl">❯ 1. Claude account with subscription</span>
  2. Anthropic Console account

        <div class="mock"><div class="mock-term">Login successful. Press Enter to continue…

<span class="hl">Do you trust the files in this folder?</span>
❯ 1. Yes, proceed

      { q: '"구독이 필요하다" / 로그인이 거절돼요', a: `Claude Code는 <b>Pro 또는 Max 유료 구독</b>이 있어야 쓸 수 있어요. <a href="https://claude.ai" target="_blank" rel="noopener">claude.ai</a>에 로그인해서 구독 상태를 확인하세요. 회사 계정이라면 관리자가 Claude Code 사용을 허용했는지 물어보세요.` },
      { q: '로그인했는데 이 화면이 계속 "진행 중"이에요', a: `[실제로 확인하기] 버튼을 눌러주세요. Claude에게 짧은 질문을 보내 진짜 로그인됐는지 확인해요(1~2분). 그래도 안 되면 검은 창에서 <code>/login</code>을 입력하고 Enter를 눌러 다시 로그인하세요.` },
      { q: '검은 창에 한글이 깨지거나 화면이 이상해요', a: `괜찮아요. 화면이 조금 깨져 보여도 동작에는 지장이 없어요. 창 크기를 키우면 대부분 나아져요.` },

    ${nav('login', states)}
  </section>`;

function viewGmail(states) {

  const pwLen = f.gmail_app_password.replace(/\s+/g, '').length;
  const smtpJob = job('smtp-check');
  const saveRes = S.ui.results.save;
  let box;
  if (S.ui.pending.save) box = stateBox('doing', '', '<b>저장하는 중…</b>');
  else if (smtpJob && smtpJob.state === 'running') box = stateBox('doing', '', `<b>Gmail에 로그인되는지 확인하는 중…</b> ${elapsed(smtpJob.started)}<br><span class="small">메일을 보내지는 않고, 로그인만 해봐요.</span>`);
  else if (s === 'done' && st.smtp && st.smtp.ok) box = stateBox('done', '✅', `<b>저장됨 + Gmail 로그인 확인 완료!</b> <span class="small">${esc(cfg.gmail_sender)} 에서 보내고, ${esc(cfg.recipient || cfg.gmail_sender)} 로 받아요.</span>`);
  else if (s === 'done') box = stateBox('done', '✅', `<b>저장되어 있어요.</b> <span class="small">${esc(cfg.gmail_sender)} · [저장하고 확인]을 누르면 Gmail 로그인도 확인해요.</span>`);

      { q: '"16글자여야 해요"라고 나와요', a: `구글이 노란 상자에 보여준 코드만 복사해야 해요. 앞뒤의 다른 글자까지 복사되지 않았는지 확인하세요. 평소 비밀번호를 넣으면 이 안내가 나와요.` },
      { q: '앱 비밀번호를 잊어버렸어요 / 창을 닫았어요', a: `다시 볼 수는 없지만 <b>새로 만들면</b> 돼요. 그림 ②부터 다시 하세요. 이름은 아무거나 괜찮아요.` },
      { q: '회사 PC에서 "인터넷 연결" 오류가 나요', a: `회사 네트워크가 메일 발송(smtp.gmail.com 465번)을 막는 경우가 있어요. 저장은 됐으니 [다음 단계]로 넘어가도 되지만, 실제 메일은 안 갈 수 있어요. 집 PC나 다른 네트워크에서 해보세요.` },
    ])}
    ${nav('gmail', states)}
  </section>`;
}

function viewAgent(states) {
  const st = S.status;
  const s = states.agent;
  const info = st ? st.agents.basic : { file: 'agent/daily_market_agent.js' };
  const run = job('run-basic');
  let box;
  if (run && run.state === 'running') box = stateBox('doing', '', `<b>테스트 메일을 보내는 중…</b> ${elapsed(run.started)}<br><span class="small">처음에는 필요한 부품을 설치하느라 1~2분 걸릴 수 있어요.</span>`);
  else if (s === 'done' && run && run.state === 'ok') box = stateBox('done', '🎉', `<b>테스트 메일을 보냈어요! 메일함을 확인해보세요.</b><br><span class="small">안 보이면 <b>스팸함</b>도 확인하세요. 받는 주소: ${esc(st.config.recipient || st.config.gmail_sender)}</span>`);
  else if (s === 'done') box = stateBox('done', '✅', `<b>자동화 프로그램이 만들어졌어요</b> <span class="small">(${esc(info.file)})</span><br><span class="small">Claude Code가 테스트 메일을 이미 보냈을 거예요. 메일함을 확인하고, 다시 보내보려면 [테스트 메일 보내기]를 누르세요.</span>`);
  else if (s === 'error') box = stateBox('warn', '⚠️', '<b>프로그램은 만들어졌는데, 실행하다 문제가 생겼어요.</b> 아래 빨간 상자를 읽어주세요.');
  else if (s === 'doing') box = stateBox('doing', '', `<b>Claude Code가 만드는 중이라면 기다려주세요.</b><br><span class="small"><code>${esc(info.file)}</code> 파일이 생기면 자동으로 초록 체크가 돼요(보통 2~5분).</span>`);
  else box = stateBox('todo', '⬜', `<b>아직 만들지 않았어요.</b> 아래 순서대로 Claude Code에게 부탁해보세요.`);
  return `<section class="card">
    ${head('agent', s, 'Claude Code에게 부탁해서 "매일 아침 환율·코스피 요약 메일" 프로그램을 만들어요.', '이게 Claude Code의 핵심이에요. 코딩을 몰라도 말로 부탁하면 프로그램이 만들어지는 걸 직접 경험해봐요. 인증키가 필요 없는 공개 데이터만 써요.')}
    ${box}
    <ol class="steps-ol">
      <li><b>Claude Code 창 열기</b> — 2단계에서 연 창이 아직 열려 있으면 그 창을 써도 돼요.
        <div class="row"><button class="btn secondary" data-action="terminal" data-for="agent">🖥️ Claude Code 창 열기</button></div></li>
      <li><b>요청 문장 복사</b> — 문장을 직접 쓸 필요 없어요. 아래 버튼을 누르세요.
        ${copyBlock(PROMPT_BASIC, '요청 문장 복사', '복사됐어요! 검은 창을 한 번 클릭하고 Ctrl+V → Enter를 누르세요.')}</li>
      <li><b>검은 창에 붙여넣기</b> — 검은 창을 마우스로 한 번 클릭하고 <span class="kbd">Ctrl</span>+<span class="kbd">V</span> → <span class="kbd">Enter</span>.
        <div class="small muted">Ctrl+V가 안 되면 마우스 오른쪽 버튼을 눌러보세요.</div></li>
      <li><b>허락해주기</b> — Claude가 "파일을 만들어도 될까요?", "이 명령을 실행해도 될까요?"라고 물으면 <b>1번(Yes)</b>을 고르고 <span class="kbd">Enter</span>. 몇 번 물어볼 수 있어요.</li>
      <li><b>기다리기</b> — 2~5분 정도 걸려요. 파일이 생기면 이 화면이 자동으로 알아차려요. 끝나면 메일함을 확인하세요!</li>
    </ol>
    <div class="row">
      <button class="btn ${s === 'done' ? '' : 'plain'}" data-action="job" data-job="run-basic" ${!info.exists || (run && run.state === 'running') ? 'disabled' : ''}>✉️ 테스트 메일 보내기</button>
      ${!info.exists ? '<span class="small muted">프로그램이 만들어지면 눌러볼 수 있어요.</span>' : ''}
    </div>
    ${run && run.state === 'ok' && run.output ? `<details data-key="run-out"${S.ui.open['run-out'] ? ' open' : ''}><summary>실행 결과 보기</summary><pre class="raw">${esc(run.output)}</pre></details>` : ''}
    ${jobError('run-basic', { fix: run && run.state === 'error' && run.error && run.error.kind !== 'agent_missing' ? fixPrompt(run.raw) : '', retry: 'retry-run' })}
    <div class="state info"><span class="ico">🔒</span><div class="small">요청 문장에 "비밀번호 파일(.env)을 열어보지 말라"고 적어두었고, 마법사 폴더의 설정(<code>.claude/settings.json</code>)으로도 Claude Code가 그 파일을 읽지 못하게 막아뒀어요.</div></div>
    ${stuck('agent', [
      { q: 'Ctrl+V를 눌러도 붙여넣기가 안 돼요', a: `검은 창을 마우스로 한 번 클릭한 다음 다시 <span class="kbd">Ctrl</span>+<span class="kbd">V</span>를 눌러보세요. 그래도 안 되면 <b>마우스 오른쪽 버튼</b>을 한 번 누르면 붙여넣어져요.` },
      { q: 'Claude가 질문을 하거나 선택지를 보여줘요', a: `편하게 대답하면 돼요. 잘 모르겠으면 <b>"알아서 가장 쉬운 방법으로 해줘"</b>라고 입력하고 Enter를 누르세요. 허락을 물으면 1번(Yes)을 고르세요.` },
      { q: '다 됐다는데 이 화면이 초록 체크가 안 돼요', a: `파일 이름이 다르게 만들어졌을 수 있어요. 아래 문장을 복사해서 검은 창에 붙여넣으세요.${copyBlock(PROMPT_RENAME, '이름 바꾸기 요청 복사')}` },
      { q: '테스트 메일이 안 와요', a: `<ol><li>Gmail의 <b>스팸함</b>과 "프로모션" 탭을 확인하세요.</li><li>3단계에서 받는 주소가 맞는지 확인하세요.</li><li>[테스트 메일 보내기]를 눌러 오류가 나오면, 빨간 상자의 [고쳐달라고 요청 복사]를 눌러 Claude에게 붙여넣으세요.</li></ol>` },
      { q: '"사용량 한도(usage limit)"에 걸렸다고 나와요', a: `구독 요금제의 사용량을 다 쓴 거예요. 안내된 시간이 지나면 다시 쓸 수 있어요. 그동안 이 화면은 그대로 두셔도 돼요.` },
    ])}
    ${nav('agent', states)}
  </section>`;
}

// ---------------------------------------------------------------------------
// 5단계: 매일 자동 실행 예약
// ---------------------------------------------------------------------------
function hourLabel(h) {
  if (h === 0) return '밤 12시 (자정)';
  if (h < 12) return `오전 ${h}시`;
  if (h === 12) return '낮 12시';
  return `오후 ${h - 12}시`;
}
function timeLabel(h, m) { return `${hourLabel(h)}${m ? ` ${m}분` : ''}`; }

function viewSchedule(states) {
  const st = S.status;
  const s = states.schedule;
  const sched = st ? st.schedule.basic : { registered: false };
  const res = S.ui.results.schedule;
  const run = job('run-basic');
  const isWin = !st || st.os === 'Windows';
  let box;
  if (S.ui.pending.schedule) box = stateBox('doing', '', '<b>예약을 바꾸는 중…</b>');
  else if (sched.registered) box = stateBox('done', '✅', `<b>예약됨: 매일 ${sched.hour !== undefined ? timeLabel(sched.hour, sched.minute) : ''}에 자동으로 메일을 보내요.</b><br><span class="small">${isWin ? 'Windows 작업 스케줄러' : 'crontab'}에 "${isWin ? 'ClaudeDailyMarket' : 'ClaudeWizard:ClaudeDailyMarket'}"라는 이름으로 등록됐어요.${res && res.fallback ? ' (간단 방식으로 등록됨: 노트북은 전원을 꽂아둬야 실행될 수 있어요)' : ''}</span>`);
  else box = stateBox('todo', '⬜', '<b>아직 예약하지 않았어요.</b> 시각을 고르고 [매일 자동 실행 등록]을 누르세요.');
  const hours = Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${S.form.hour == h ? 'selected' : ''}>${hourLabel(h)}</option>`).join('');
  const mins = Array.from({ length: 12 }, (_, i) => i * 5).map((m) => `<option value="${m}" ${S.form.minute == m ? 'selected' : ''}>${String(m).padStart(2, '0')}분</option>`).join('');
  const last = st && st.last_run;
  return `<section class="card">
    ${head('schedule', s, '정해진 시각에 매일 저절로 메일이 오도록 예약해요.', '매번 직접 실행하지 않아도 되게 하는 게 "자동화"예요. 예약해두면 매일 아침 메일함만 열면 돼요.')}
    ${box}
    <div class="state warn"><span class="ico">💡</span><div><b>PC가 켜져 있어야 실행돼요.</b><br>
      <span class="small">예약한 시각에 PC가 꺼져 있거나 잠자기(절전) 상태면 그 시각에는 보내지 않아요. 대신 다음에 PC를 켜고 로그인하면 놓친 것을 한 번 보내요.${isWin ? ' 등록할 때 관리자 권한은 필요 없어요(내 계정에만 등록).' : ''}</span></div></div>
    <label class="field">매일 몇 시에 받을까요?</label>
    <div class="row">
      <select id="f-hour" data-bind="hour" aria-label="시">${hours}</select>
      <select id="f-min" data-bind="minute" aria-label="분">${mins}</select>
    </div>
    <div class="row">
      <button class="btn" data-action="schedule" ${S.ui.pending.schedule ? 'disabled' : ''}>${sched.registered ? '이 시각으로 바꾸기' : '⏰ 매일 자동 실행 등록'}</button>
      <button class="btn secondary" data-action="job" data-job="run-basic" ${run && run.state === 'running' ? 'disabled' : ''}>▶ 지금 한 번 실행</button>
      ${sched.registered ? '<button class="btn plain" data-action="unschedule">예약 해제</button>' : ''}
    </div>
    ${res && !res.ok ? errorBox(res.error, res.raw, { key: 'schedule', retry: 'schedule' }) : ''}
    ${run && run.state === 'running' ? stateBox('doing', '', `<b>지금 실행하는 중…</b> ${elapsed(run.started)}`) : ''}
    ${run && run.state === 'ok' ? stateBox('done', '📬', '<b>방금 실행했어요. 메일함을 확인하세요.</b>') : ''}
    ${jobError('run-basic', { fix: run && run.state === 'error' ? fixPrompt(run.raw) : '', retry: 'retry-run' })}
    ${last ? `<h3>최근 실행 기록 <span class="small muted">(agent/last_run.log)</span></h3><pre class="raw">${esc(last.lines.join('\n'))}</pre>` : ''}
    ${stuck('schedule', [
      { q: '"액세스가 거부되었습니다" / 등록이 안 돼요', a: `회사 PC는 보안 정책으로 예약 작업 등록을 막는 경우가 있어요. 전산 담당자에게 "내 계정으로 작업 스케줄러 작업을 만들 수 있게 해달라"고 요청하세요. 집 PC라면 열려 있는 다른 창을 닫고 [다시 시도]를 눌러보세요.` },
      { q: '시간이 됐는데 메일이 안 왔어요', a: `<ol><li>그 시각에 PC가 켜져 있었는지, 잠자기 상태가 아니었는지 확인하세요.</li><li>[지금 한 번 실행]을 눌러서 메일이 오는지 확인하세요. 오면 예약 문제, 안 오면 프로그램 문제예요.</li><li>"최근 실행 기록"에 실패가 있으면 4단계의 [고쳐달라고 요청 복사]를 이용하세요.</li></ol>` },
      { q: '아침에 검은 창이 잠깐 떴다가 사라져요', a: `정상이에요. 예약된 프로그램이 실행되면서 잠깐 보이는 창이에요. 저절로 닫혀요.` },
      { q: '그만 받고 싶어요 / 시간을 바꾸고 싶어요', a: `시간을 바꾸려면 시각을 다시 고르고 [이 시각으로 바꾸기]. 그만 받으려면 [예약 해제]를 누르세요. 프로그램 파일은 지워지지 않아요.` },
      { q: 'PC를 꺼도 매일 받고 싶어요', a: `그러려면 항상 켜져 있는 "클라우드 서버"에 옮겨야 해요. 완료 화면의 "다음 도전"에서 Claude Code에게 부탁하는 문장을 드려요.` },
    ])}
    ${nav('schedule', states)}
  </section>`;
}

function viewFinish(states) {
  const st = S.status;
  const sched = st ? st.schedule.basic : {};
  const adv = st ? st.agents.advanced : { exists: false };
  const advSched = st ? st.schedule.advanced : { registered: false };
  const advRun = job('run-advanced');
  const allDone = WORK.every((w) => states[w] === 'done');
  return `<section class="card">
    <div class="kicker">완료</div>
    <h2>${allDone ? '🎉 모두 끝났어요! 수고하셨어요' : '거의 다 왔어요'}</h2>
    ${allDone ? stateBox('done', '✅', `<b>Claude Code 설치 → 로그인 → 첫 자동화 → 매일 예약</b>까지 혼자 해내셨어요.<br><span class="small">내일 ${sched.hour !== undefined ? timeLabel(sched.hour, sched.minute) : '정해진 시각'}에 첫 자동 메일이 와요 (PC가 켜져 있으면).</span>`)

    <div class="twocol">
      <div class="box"><b>보기 좋게 꾸미기</b>${copyBlock('agent/daily_market_agent.js 가 보내는 메일을 표 형태의 보기 좋은 HTML로 꾸며줘. 오른 것은 빨간색, 내린 것은 파란색으로 보여줘. 고친 다음 테스트 메일 1통 보내줘.', '복사')}</div>
      <div class="box"><b>한 줄 요약 넣기</b>${copyBlock('agent/daily_market_agent.js 메일 맨 위에 오늘 환율과 코스피 흐름을 쉬운 말로 2문장 요약해서 넣어줘. 고친 다음 테스트 메일 1통 보내줘.', '복사')}</div>
    </div>

    <h3>🎓 심화 실습: 업종(섹터) 리포트 <span class="tag">KRX API 키 필요</span></h3>
    <p class="small">한국거래소 데이터로 업종별 등락률 메일을 만들어요. <a href="https://data-dbg.krx.co.kr" target="_blank" rel="noopener">KRX 정보데이터시스템(data-dbg.krx.co.kr)</a>에서 무료로 키를 받아야 해요(승인까지 하루쯤 걸릴 수 있어요).</p>
    <details data-key="advanced"${S.ui.open.advanced ? ' open' : ''}><summary>심화 실습 펼치기</summary>
      <ol class="steps-ol">
        <li><b>KRX API 키 저장</b> ${st && st.config.has_krx_key ? '<span class="saved-tag">✓ 저장됨</span>' : ''}
          <input type="password" id="f-krx" data-bind="krx_key" value="${esc(S.form.krx_key)}" autocomplete="new-password" placeholder="${st && st.config.has_krx_key ? '이미 저장됨 — 바꿀 때만 새로 붙여넣기' : 'KRX에서 받은 인증키 붙여넣기'}">
          <div class="row"><button class="btn small" data-action="save-krx">저장</button>${S.ui.results.krx ? (S.ui.results.krx.ok ? '<span style="color:var(--ok);font-weight:700">✓ 저장했어요</span>' : '') : ''}</div>
          ${S.ui.results.krx && !S.ui.results.krx.ok ? errorBox(S.ui.results.krx.error, '', { key: 'krx' }) : ''}</li>
        <li><b>Claude Code에게 부탁하기</b>${copyBlock(PROMPT_ADVANCED, '심화 요청 문장 복사', '복사됐어요! 검은 창을 클릭하고 Ctrl+V → Enter를 누르세요.')}</li>
        <li><b>확인하고 예약하기</b> ${adv.exists ? '<span class="saved-tag">✓ 프로그램 있음</span>' : '<span class="small muted">(agent/sector_report_agent.js가 생기면 버튼이 켜져요)</span>'}

function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !document.getElementById('view').contains(a)) return null;
  return { id: a.id, start: a.selectionStart, end: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.focus();
  try { if (f.start != null) el.setSelectionRange(f.start, f.end); } catch (e) { /* select 등은 지원 안 함 */ }
}

function go(view) {
  S.view = view;
  S.autoNext = null;
  clearTimeout(S.autoTimer);
  if (!DEMO) { try { history.replaceState(null, '', '#' + view); } catch (e) { /* ignore */ } }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

async function copyText(text, msg) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
  }
  toast(ok ? (msg || '복사됐어요! 붙여넣을 곳을 클릭하고 Ctrl+V를 누르세요.') : '복사가 안 됐어요. 글자를 마우스로 드래그해서 선택한 뒤 Ctrl+C를 눌러주세요.');
}

async function startJob(name) {
  try {
    const r = await api('/api/jobs/' + name, {});
    if (r && r.job && S.status) { S.status.jobs = Object.assign({}, S.status.jobs, { [name]: r.job }); render(); }
  } catch (e) { S.serverDown = true; render(); }
  schedulePoll();
}

async function syncAction(key, fn) {
  S.ui.pending[key] = true;
  delete S.ui.results[key];
  render();
  try {
    S.ui.results[key] = await fn();
  } catch (e) {
    S.ui.results[key] = { ok: false, error: { kind: 'server_down', title: '마법사 서버와 연결이 끊겼어요', what: '마법사의 검은 창이 닫혔거나 멈춘 것 같아요.', todo: ['start.bat을 다시 더블클릭한 뒤 다시 눌러주세요.'] } };
  }
  S.ui.pending[key] = false;
  await refresh();
  return S.ui.results[key];
}

async function saveConfig() {
  const f = S.form;
  const r = await syncAction('save', () => api('/api/save-config', { gmail_sender: f.gmail_sender, gmail_app_password: f.gmail_app_password, recipient: f.recipient }));
  if (r && r.ok) {
    S.form.gmail_app_password = '';
    toast('저장했어요. 이제 Gmail 로그인을 확인할게요.');
    await startJob('smtp-check');
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-action]')) ACTIONS[el.dataset.action](el);
  if (el.matches('select[data-bind]')) { S.form[el.dataset.bind] = Number(el.value); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('input[data-bind]')) {
    S.form[el.dataset.bind] = el.value;
    if (el.dataset.bind === 'gmail_app_password') render(); // 글자 수 표시 갱신
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('form[data-form=gmail] input')) { e.preventDefault(); saveConfig(); }
});

document.addEventListener('toggle', (e) => {
  const k = e.target.dataset && e.target.dataset.key;
  if (k) S.ui.open[k] = e.target.open;
}, true);

setInterval(() => {
  document.querySelectorAll('[data-elapsed]').forEach((el) => {

function demoApi(path) {
  // 데모에서 버튼을 누르면: 진행 중 → 잠시 뒤 완료 로 바뀐다.
  const map = { '/api/jobs/install': 'install', '/api/jobs/login-verify': 'login', '/api/open-terminal': S.view === 'agent' ? 'agent' : 'login', '/api/save-config': 'gmail', '/api/jobs/smtp-check': 'gmail', '/api/jobs/run-basic': 'agent', '/api/schedule': 'schedule' };
  const step = map[path];
  if (step) {
    S.demo.states[step] = 'doing';
    setTimeout(() => { S.demo.states[step] = 'done'; refresh(); }, 1800);
  }
  if (path === '/api/unschedule') { S.demo.states.schedule = 'todo'; }
  return Promise.resolve({ ok: true, claude_found: true });
}

function renderDemo() {
  const el = document.getElementById('demo');
  if (!DEMO || S.demo.hidden) { if (el.innerHTML) el.innerHTML = ''; return; }
  const cur = WORK.includes(S.view) ? S.view : null;
  const html = `<div class="demo" role="region" aria-label="데모 모드 조작판">
    <button class="x" data-demo="hide" title="조작판 숨기기">×</button>
    <b>데모 모드</b> <span style="color:#bbb">서버 없이 화면만 확인</span>
    <div class="r">${STEPS.map((s) => `<button class="${S.view === s.id ? 'on' : ''}" data-demo="view" data-v="${s.id}">${s.n || ''}${s.n ? ' ' : ''}${esc(s.short)}</button>`).join('')}</div>
    ${cur ? `<div style="margin-top:6px">${STEPS.find((s) => s.id === cur).n}단계 상태:</div>
    <div class="r">${['todo', 'doing', 'done', 'error'].map((k) => `<button class="${S.demo.states[cur] === k ? 'on' : ''}" data-demo="state" data-v="${k}">${STATE_LABEL[k]}</button>`).join('')}</div>` : ''}
    <div class="r"><button data-demo="all" data-v="done">모두 완료</button><button data-demo="all" data-v="todo">모두 처음으로</button></div>
  </div>`;
  if (el.innerHTML !== html) el.innerHTML = html;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-demo]');
  if (!el) return;
  const k = el.dataset.demo; const v = el.dataset.v;
  if (k === 'hide') S.demo.hidden = true;
  if (k === 'view') { S.view = v; }
  if (k === 'state' && WORK.includes(S.view)) S.demo.states[S.view] = v;
  if (k === 'all') WORK.forEach((w) => { S.demo.states[w] = v; });
  refresh();
});

// ===========================================================================
// 시작
// ===========================================================================
(function init() {
  if (DEMO) {
    const v = PARAMS.get('view');
    const stt = PARAMS.get('state');
    if (v && STEPS.some((s) => s.id === v)) {
      S.view = v;
      const idx = WORK.indexOf(v);
      WORK.forEach((w, i) => { if (idx < 0 ? v === 'finish' : i < idx) S.demo.states[w] = 'done'; });
      if (idx >= 0 && stt && STATE_LABEL[stt]) S.demo.states[v] = stt;
    }
    if (PARAMS.get('stuck') === '1' && WORK.includes(S.view)) S.ui.stuck[S.view] = true;
    if (PARAMS.get('panel') === '0') S.demo.hidden = true;
    if (PARAMS.get('checked') === '1') S.checklist = { win: true, net: true, sub: true, gmail: true };
    refresh();
    return;
  }
  const hash = location.hash.replace('#', '');
  if (STEPS.some((s) => s.id === hash)) S.view = hash;
  refresh().then(() => {
    if (!unlocked(S.view, computeStates())) S.view = 'start';
    render();
    schedulePoll();
  });
})();
</script>
</body>
</html>
